server:
  port: 8080

spring:
  application:
    name: claims-intake
  datasource:
    url: ${CLAIMS_DB_URL:jdbc:postgresql://localhost:5432/claims}
    username: ${CLAIMS_DB_USER:claims}
    password: ${CLAIMS_DB_PASSWORD}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

claims:
  storage-root: /var/lib/claims/documents
  quarantine-dir: /var/lib/claims/quarantine
  thumbnail-dir: /var/lib/claims/thumbnails
  portal-base-url: https://portal.acme-insurance.example
  underwriting-url: http://underwriting:8080
  payment-gateway-url: https://payments.acme-insurance.example
  payment-gateway-api-key: ${PAYMENT_GATEWAY_API_KEY}
  repair-shop-hosts:
    - estimates.autofixnetwork.example
    - api.collisionpartners.example
