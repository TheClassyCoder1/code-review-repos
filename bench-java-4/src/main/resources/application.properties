quarkus.http.port=8080
quarkus.http.limits.max-body-size=512K

quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${TRACKING_DB_URL:jdbc:postgresql://localhost:5432/tracking}
quarkus.datasource.username=${TRACKING_DB_USER:tracking}
quarkus.datasource.password=${TRACKING_DB_PASSWORD}
quarkus.hibernate-orm.database.generation=validate

quarkus.rest-client.carrier-api.url=${CARRIER_API_URL:https://carrier-gateway.internal}
quarkus.rest-client.carrier-api.connect-timeout=2000
quarkus.rest-client.carrier-api.read-timeout=5000

tracking.carrier.pod-url=${CARRIER_POD_URL:https://carrier-gateway.internal/pod}
tracking.carrier.alerts-url=${CARRIER_ALERTS_URL:https://carrier-gateway.internal/alerts}
tracking.webhook.dhl-secret=${DHL_WEBHOOK_SECRET}
tracking.webhook.ups-secret=${UPS_WEBHOOK_SECRET}
tracking.labels.root=${LABELS_ROOT:/var/lib/tracking/labels}
tracking.stale.after-hours=72
tracking.billing.fuel-surcharge-pct=7.5

mp.messaging.incoming.carrier-scans.connector=smallrye-kafka
mp.messaging.incoming.carrier-scans.topic=carrier.scans.v1
mp.messaging.incoming.carrier-scans.group.id=shipment-tracking
