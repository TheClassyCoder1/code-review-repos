ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ com.mobilebank.ApplicationKt.module ]
    }
}

bank {
    env = "local"
    env = ${?BANK_ENV}
    db-url = "jdbc:postgresql://localhost:5432/mobilebank"
    db-url = ${?DB_URL}
    jwt-secret = ${?JWT_SECRET}
    webhook-secret = ${?WEBHOOK_SECRET}
    statement-dir = "/var/lib/mobilebank/statements"
    archive-dir = "/var/lib/mobilebank/archive"
    trusted-bank-hosts = ["directory.sepa-banks.eu", "api.swift-lookup.net"]
    public-base-url = "https://app.mobilebank.example"
}
