apiVersion: apps/v1
kind: Deployment
metadata:
  name: loan-service
  namespace: lending
  labels:
    app.kubernetes.io/name: loan-service
    app.kubernetes.io/part-of: lending
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: loan-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loan-service
        app.kubernetes.io/part-of: lending
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: loan-service
          image: registry.internal/lending/loan-service:2026.10.3
          ports:
            - name: http
              containerPort: 8081
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://db-primary.lending.svc.cluster.local:5432/lending?currentSchema=lending
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: loan-service-db
                  key: password
            - name: RISK_SERVICE_URL
              value: http://risk-service.lending.svc.cluster.local:8082
            - name: JAVA_TOOL_OPTIONS
              value: -XX:MaxRAMPercentage=75
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 45
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: loan-service
  namespace: lending
spec:
  selector:
    app.kubernetes.io/name: loan-service
  ports:
    - name: http
      port: 8081
      targetPort: http
