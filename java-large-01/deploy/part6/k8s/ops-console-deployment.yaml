apiVersion: apps/v1
kind: Deployment
metadata:
  name: ops-console
  namespace: lending-ops
  labels:
    app.kubernetes.io/name: ops-console
    app.kubernetes.io/part-of: lending-platform
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: ops-console
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ops-console
    spec:
      serviceAccountName: ops-console
      containers:
        - name: ops-console
          image: registry.lending.internal/ops/ops-console:1.6.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: ops-console-env
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: ops-console
  namespace: lending-ops
spec:
  selector:
    app.kubernetes.io/name: ops-console
  ports:
    - name: http
      port: 80
      targetPort: http
