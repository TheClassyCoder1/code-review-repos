spring.datasource.url=${OPS_DB_URL:jdbc:postgresql://localhost:5432/ops_console}
spring.datasource.username=${OPS_DB_USER:ops_console}
spring.datasource.password=${OPS_DB_PASSWORD:}
ops.partner.secret-key=${OPS_PARTNER_SECRET_KEY:}
ops.partner.secret-salt=${OPS_PARTNER_SECRET_SALT:}
ops.jwt.signing-key=${OPS_JWT_SIGNING_KEY:}
ops.jwt.issuer=${OPS_JWT_ISSUER:ops-console}
ops.oauth2.server-url=${OPS_OAUTH2_SERVER_URL:http://localhost:8130}
ops.oauth2.client-id=${OPS_OAUTH2_CLIENT_ID:ops-console}
ops.oauth2.client-secret=${OPS_OAUTH2_CLIENT_SECRET:}
ops.platform.email-config.relay-url=${OPS_MAIL_RELAY_URL:}
ops.platform.email-config.relay-user=${OPS_MAIL_RELAY_USER:}
ops.platform.email-config.relay-password=${OPS_MAIL_RELAY_PASSWORD:}
ops.cluster.peer-hosts=${OPS_CLUSTER_PEER_HOSTS:}
ops.backup.tmp-dir=${OPS_BACKUP_TMP_DIR:/var/tmp/ops-console/backup}
