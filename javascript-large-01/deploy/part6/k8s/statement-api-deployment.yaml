apiVersion: apps/v1
kind: Deployment
metadata:
  name: statement-export-api
  namespace: lending
  labels:
    app.kubernetes.io/name: statement-export-api
    app.kubernetes.io/part-of: lending-platform
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: statement-export-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: statement-export-api
        app.kubernetes.io/part-of: lending-platform
    spec:
      serviceAccountName: statement-export
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: api
          image: registry.internal.lending/statement-export-api:1.6.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8101
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "8101"
          envFrom:
            - secretRef:
                name: statement-export-secrets
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: statement-cache
              mountPath: /var/lib/statements
      volumes:
        - name: statement-cache
          emptyDir:
            sizeLimit: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: statement-export-api
  namespace: lending
spec:
  selector:
    app.kubernetes.io/name: statement-export-api
  ports:
    - name: http
      port: 80
      targetPort: http
