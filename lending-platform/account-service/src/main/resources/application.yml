server:
  port: 8091

spring:
  application:
    name: account-service
  datasource:
    # db-primary schema "platform" -> TRUE shared with billing-service primary
    url: jdbc:postgresql://db-primary:5432/platform?currentSchema=platform
    username: account
    password: account
    driver-class-name: org.postgresql.Driver
    hikari:
      # Hikari waits 30s for a pooled connection by default; fail fast so account lookups from billing don't pile up.
      connection-timeout: 2000
  jpa:
    hibernate:
      ddl-auto: none
  kafka:
    bootstrap-servers: broker-a:9092

# Same config KEY as billing-service, DIFFERENT value (0.02 vs billing 0.03). Trap.
platform:
  fee:
    rate: 0.02
