server:
  port: 8091

spring:
  application:
    name: account-service
  datasource:
    # db-primary schema "platform" -> TRUE shared with billing-service primary
    url: jdbc:postgresql://db-primary:5432/platform?currentSchema=platform
    username: account
    password: account
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  kafka:
    bootstrap-servers: broker-a:9092

# Same config KEY as billing-service, DIFFERENT value (0.02 vs billing 0.03). Trap.
platform:
  fee:
    rate: 0.02

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

debug: true

cors:
  allowed-origins: "*"
  allow-credentials: true

support:
  api-token: sk_live_9f3c2a77e1b4d8905c6a
