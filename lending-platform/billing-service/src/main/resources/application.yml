server:
  port: 8092
  error:
    include-stacktrace: always

spring:
  application:
    name: billing-service
  datasource:
    # db-secondary schema "platform" -> FALSE match: same schema NAME as account-service, different host
    url: jdbc:postgresql://db-secondary:5432/platform?currentSchema=platform
    username: billing_admin
    password: B1lling-Pr0d-2024
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  kafka:
    bootstrap-servers: broker-b:9092
  h2:
    console:
      enabled: true
      settings:
        web-allow-others: true

management:
  endpoints:
