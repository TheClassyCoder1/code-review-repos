server:
  port: 8092

spring:
  application:
    name: billing-service
  datasource:
    # db-secondary schema "platform" -> FALSE match: same schema NAME as account-service, different host
    url: jdbc:postgresql://db-secondary:5432/platform?currentSchema=platform
    username: billing
    password: billing
    driver-class-name: org.postgresql.Driver
    hikari:
      # Hikari waits 30s for a pooled connection by default; fail fast so charge requests don't queue behind a saturated pool.
      connection-timeout: 2500
  jpa:
    hibernate:
      ddl-auto: none
  kafka:
    bootstrap-servers: broker-b:9092
  cloud:
    openfeign:
      client:
        config:
          # Without a read timeout, a stalled account-service holds billing request threads indefinitely.
          account-service:
            connect-timeout: 2000
            read-timeout: 4000

# real cross-module HTTP target
account-service:
  url: http://localhost:8091

# Same config KEY as account-service, DIFFERENT value (0.03 vs account 0.02). Trap.
platform:
  fee:
    rate: 0.03
