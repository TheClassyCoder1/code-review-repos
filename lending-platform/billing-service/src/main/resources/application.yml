server:
  port: 8092

spring:
  application:
    name: billing-service
  datasource:
    # db-secondary schema "platform" -> FALSE match: same schema NAME as account-service, different host
    url: jdbc:postgresql://db-secondary:5432/platform?currentSchema=platform
    username: billing
    password: billing
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
  kafka:
    bootstrap-servers: broker-b:9092
  cloud:
    openfeign:
      client:
        config:
          # Without a read timeout, a stalled account-service holds billing request threads indefinitely.
          account-service:
            connect-timeout: 2000
            read-timeout: 4000

# real cross-module HTTP target
account-service:
  url: http://localhost:8091

# Same config KEY as account-service, DIFFERENT value (0.03 vs account 0.02). Trap.
platform:
  fee:
    rate: 0.03

billing:
  zone: ${BILLING_ZONE:Europe/Amsterdam}
  dunning:
    enabled: ${BILLING_DUNNING_ENABLED:true}
    cron: ${BILLING_DUNNING_CRON:0 30 6 * * *}
    grace-period-days: ${BILLING_DUNNING_GRACE_DAYS:5}
    late-fee-rate: ${BILLING_DUNNING_LATE_FEE_RATE:0.02}
    late-fee-cap: ${BILLING_DUNNING_LATE_FEE_CAP:25}
    max-reminders: ${BILLING_DUNNING_MAX_REMINDERS:3}
    reminder-interval-days: ${BILLING_DUNNING_REMINDER_INTERVAL_DAYS:7}
