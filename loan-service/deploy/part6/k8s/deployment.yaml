apiVersion: apps/v1
kind: Deployment
metadata:
  name: loan-service
  namespace: lending
  labels:
    app.kubernetes.io/name: loan-service
    app.kubernetes.io/part-of: lending
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: loan-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loan-service
        app.kubernetes.io/part-of: lending
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: loan-service
          image: registry.internal/lending/loan-service:1.6.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: LOAN_ANALYTICS_ENABLED
              value: "true"
          envFrom:
            - secretRef:
                name: loan-service-datasource
            - secretRef:
                name: loan-service-analytics
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: loan-service
  namespace: lending
spec:
  selector:
    app.kubernetes.io/name: loan-service
  ports:
    - name: http
      port: 8081
      targetPort: http
