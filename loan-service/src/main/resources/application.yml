server:
  port: 8081

spring:
  application:
    name: loan-service
  datasource:
    # db-primary:5432 schema "lending" -> TRUE shared with risk-service primaryDataSource
    url: jdbc:postgresql://db-primary:5432/lending?currentSchema=lending
    username: loan
    password: loan
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
  kafka:
    bootstrap-servers: broker-a:9092

# risk-service base URL, consumed by Feign + WebClient + gRPC clients
risk-service:
  url: http://localhost:8082

grpc:
  client:
    risk-service:
      address: static://localhost:9090
      negotiation-type: plaintext

# Same config KEY as risk-service, DIFFERENT value (0.7 vs risk's 0.5). Trap.
lending:
  risk:
    threshold: 0.7
  pricing:
    annual-rate-bps: 1450
  portal:
    base-url: https://portal.lending.example.com
    allowed-return-hosts: portal.lending.example.com,app.lending.example.com
  bank-link:
    authorize-url: https://auth.openbanking.example.com/authorize
    client-id: ${BANK_LINK_CLIENT_ID}
    redirect-uri: https://api.lending.example.com/api/v1/bank-link/callback
  partners:
    disbursement:
      signing-secret: ${PARTNER_DISBURSEMENT_SIGNING_SECRET}
    bureau:
      signing-secret: ${BUREAU_SIGNING_SECRET}
