server:
  port: 8081
  error:
    include-stacktrace: always
    include-message: always

spring:
  application:
    name: loan-service
  datasource:
    # db-primary:5432 schema "lending" -> TRUE shared with risk-service primaryDataSource
    url: jdbc:postgresql://db-primary.prod.internal:5432/lending?currentSchema=lending
    username: loan_admin
    password: Pr0d-L0an-2024!
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 500
      leak-detection-threshold: 0
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  kafka:
