# Loan statement generation (loaded by StatementSettings).

# Maximum number of lines returned on one statement; older lines are summarised.
lending.statement.export.max-rows=120

# Minimum payment: a percentage of the closing balance, never below the floor (GBP).
lending.statement.minimum-payment-percent=3
lending.statement.minimum-payment-floor=25

# Days between the end of the statement period and the payment due date.
lending.statement.due-after-days=21

# How long issued statements are kept. Replaces lending.statement.retain-days; both keys are
# honoured until every environment's overrides have been renamed.
lending.statement.retention-days=400
