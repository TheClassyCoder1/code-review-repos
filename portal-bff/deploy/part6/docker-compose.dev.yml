# Local development only — never used by CI or any cluster deployment.
# Brings up the backends portal-bff talks to so `npm run start:dev` works on a laptop.
# ':latest' is deliberate here: developers want whatever was built most recently on their
# machine. Deployed images are pinned to release tags in each service's deploy/ manifests.
#
#   docker compose -f deploy/part6/docker-compose.dev.yml up -d

services:
  loan-service:
    image: registry.internal/lending/loan-service:latest
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      LOAN_ANALYTICS_ENABLED: "false"
    depends_on:
      - postgres
      - kafka

  risk-service:
    image: registry.internal/lending/risk-service:latest
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: dev
    depends_on:
      - postgres
      - kafka

  postgres:
    image: postgres:16.3-alpine
    environment:
      POSTGRES_DB: lending
      POSTGRES_USER: lending
      POSTGRES_PASSWORD: local-dev-only
    ports:
      - "5432:5432"

  kafka:
    image: bitnami/kafka:3.7.0
    environment:
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
    ports:
      - "9092:9092"
