apiVersion: apps/v1
kind: Deployment
metadata:
  name: opsdesk-api
  namespace: lending-ops
  labels:
    app.kubernetes.io/name: opsdesk-api
    app.kubernetes.io/part-of: opsdesk
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: opsdesk-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opsdesk-api
        app.kubernetes.io/part-of: opsdesk
    spec:
      serviceAccountName: opsdesk-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: api
          image: registry.lending.internal/opsdesk/api:2026.10.3
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8120
          envFrom:
            - configMapRef:
                name: opsdesk-config
            - secretRef:
                name: opsdesk-secrets
          readinessProbe:
            httpGet:
              path: /docs
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /docs
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: opsdesk-api
  namespace: lending-ops
spec:
  selector:
    app.kubernetes.io/name: opsdesk-api
  ports:
    - name: http
      port: 80
      targetPort: http
