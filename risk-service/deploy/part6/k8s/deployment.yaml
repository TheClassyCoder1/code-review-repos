apiVersion: apps/v1
kind: Deployment
metadata:
  name: risk-service
  namespace: lending
  labels:
    app.kubernetes.io/name: risk-service
    app.kubernetes.io/part-of: lending
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: risk-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: risk-service
        app.kubernetes.io/part-of: lending
    spec:
      containers:
        - name: risk-service
          image: registry.internal/lending/risk-service:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8082
            - name: grpc
              containerPort: 9090
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: RISK_EXPOSURE_MAX_BATCH_SIZE
              value: "200"
          envFrom:
            - secretRef:
                name: risk-service-datasources
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: risk-service
  namespace: lending
spec:
  selector:
    app.kubernetes.io/name: risk-service
  ports:
    - name: http
      port: 8082
      targetPort: http
    - name: grpc
      port: 9090
      targetPort: grpc
