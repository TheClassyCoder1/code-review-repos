server:
  port: 8082

spring:
  application:
    name: risk-service
  kafka:
    # broker-a is the REAL shared broker (loan.applied consumer, risk.assessed producer)
    bootstrap-servers: broker-a:9092

# TWO datasources, SAME schema name "lending", DIFFERENT hosts.
# primary  -> db-primary:5432   (TRUE shared with loan-service)
# reporting -> db-secondary:5432 (FALSE match: same schema name, different host)
datasource:
  primary:
    jdbc-url: jdbc:postgresql://db-primary:5432/lending?currentSchema=lending
    username: risk
    password: risk
    driver-class-name: org.postgresql.Driver
    # Shared with loan-service; without a bound, a saturated db-primary stalls listener threads for 30s.
    connection-timeout: 2000
  reporting:
    jdbc-url: jdbc:postgresql://db-secondary:5432/lending?currentSchema=lending
    username: report
    password: report
    driver-class-name: org.postgresql.Driver
    # Hikari waits 30s for a connection by default; fail fast when db-secondary is unreachable.
    connection-timeout: 3000

# Renamed from lending.risk.threshold: the value is the auto-approval cut-off,
# distinct from the manual-review band below.
lending:
  risk:
    approval-threshold: 0.5
    manual-review:
      upper-bound: 0.65
      max-open-cases: 200

grpc:
  server:
    port: 9090
