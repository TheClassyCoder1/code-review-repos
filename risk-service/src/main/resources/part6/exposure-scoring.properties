# Exposure scoring defaults. Ops overrides live in the deployment environment.

# Upper bound (inclusive) of each band, as a fraction of the per-tier exposure ceiling.
risk.exposure.band.low-max=0.35
risk.exposure.band.medium-max=0.70

# Per-tier exposure ceilings in GBP.
risk.exposure.ceiling.standard=100000
risk.exposure.ceiling.premium=250000
risk.exposure.ceiling.micro=10000

# How long a computed band table stays cached before it is rebuilt.
# Renamed from risk.exposure.cache-ttl-seconds to group cache settings under risk.exposure.cache.*
risk.exposure.cache.ttl-seconds=120

# Largest number of loans accepted by one batch review request.
risk.exposure.max-batch-size=200
