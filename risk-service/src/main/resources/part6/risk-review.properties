# Manual-review banding for risk assessments.
#
# Scores at or above lending.risk.review.manual-threshold are routed to an
# underwriter. It is intentionally not set here: a bundled value would shadow
# environments that still set the old lending.risk.manual-review-threshold key.
# The default (0.65) lives in ManualReviewSettings.
#
# Scores at or above this threshold are declined without review.
lending.risk.review.decline-threshold=0.85
