apiVersion: apps/v1
kind: Deployment
metadata:
  name: document-intake-identity-worker
  namespace: lending
  labels:
    app.kubernetes.io/name: document-intake
    app.kubernetes.io/component: identity-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: document-intake
      app.kubernetes.io/component: identity-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: document-intake
        app.kubernetes.io/component: identity-worker
    spec:
      containers:
        - name: worker
          image: registry.lending.internal.test/document-intake/identity-worker:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: document-intake-config
            - secretRef:
                name: document-intake-secrets
          env:
            - name: WORKER_CONCURRENCY
              value: "4"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
