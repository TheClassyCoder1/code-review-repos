apiVersion: apps/v1
kind: Deployment
metadata:
  name: document-intake-api
  namespace: lending
  labels:
    app.kubernetes.io/name: document-intake
    app.kubernetes.io/component: api
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: document-intake
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: document-intake
        app.kubernetes.io/component: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: api
          image: registry.lending.internal.test/document-intake/api:2026.10.3
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8120
          envFrom:
            - configMapRef:
                name: document-intake-config
            - secretRef:
                name: document-intake-secrets
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
